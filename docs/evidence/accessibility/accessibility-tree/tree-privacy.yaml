- main:
  - article:
    - heading "Privacy notice" [level=1]
    - paragraph: Recipe Box is a student project built for the CSCK543 module at the University of Liverpool. It is run locally for demonstration and assessment, not as a public service. This page explains what it stores about you, why, and how to remove it.
    - region "What we store, and why":
      - heading "What we store, and why" [level=2]
      - table:
        - rowgroup:
          - row "What Why":
            - columnheader "What"
            - columnheader "Why"
        - rowgroup:
          - row "Your name To show on your account page.":
            - rowheader "Your name"
            - cell "To show on your account page."
          - row "Your email address To log you in, and to send a password reset link when you ask for one. It is never shown to other users.":
            - rowheader "Your email address"
            - cell "To log you in, and to send a password reset link when you ask for one. It is never shown to other users."
          - row "Your password To log you in. It is stored only as a one-way hash, so nobody, including us, can read it.":
            - rowheader "Your password"
            - cell "To log you in. It is stored only as a one-way hash, so nobody, including us, can read it."
          - row "Recipes you save and rate To list them on your account page. Your scores also count towards each recipe's average rating, which everyone can see without your name attached.":
            - rowheader "Recipes you save and rate"
            - cell "To list them on your account page. Your scores also count towards each recipe's average rating, which everyone can see without your name attached."
          - row "Your login session To keep you logged in between pages. While a session lasts we also hold your IP address and your browser's description of itself.":
            - rowheader "Your login session"
            - cell "To keep you logged in between pages. While a session lasts we also hold your IP address and your browser's description of itself."
      - paragraph: That is all. We ask for nothing else, use no analytics or advertising, and do not share your details with anyone.
    - region "Cookies":
      - heading "Cookies" [level=2]
      - list:
        - listitem:
          - code: recipe-box-session
          - text: identifies your session, so you stay logged in.
        - listitem:
          - code: XSRF-TOKEN
          - text: protects the forms from being submitted by other websites.
        - listitem:
          - text: A "remember me" cookie is set only if you tick
          - emphasis: Remember me
          - text: when you log in.
      - paragraph: All of them are needed for the site to work; none of them tracks you.
    - region "Removing your data":
      - heading "Removing your data" [level=2]
      - paragraph: You can delete your account at any time from your account settings once you have logged in. This removes your account, your saved recipes and your ratings straight away.
      - paragraph: The accounts used in demonstrations and screenshots are fictional. Rebuilding the database, which we do to return it to a known state, deletes every account, including any registered by hand.
    - region "The recipes":
      - heading "The recipes" [level=2]
      - paragraph: The recipes, their text and their images come from BBC Food and are reproduced for the educational purpose of this assignment only. Each recipe page links to its original.
